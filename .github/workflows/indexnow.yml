name: IndexNow

# After a push to master is deployed by Netlify, submit the sitemap to IndexNow
# (Bing, Yandex, Seznam, Naver…). Release-data commits made by the sync
# workflow ping IndexNow from that workflow instead.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'src/data/releases*.json'
      - '.github/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for the Netlify deploy
        run: sleep 300
      - name: Submit sitemap URLs
        continue-on-error: true
        run: node scripts/indexnow.mjs
