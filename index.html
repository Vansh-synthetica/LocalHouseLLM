    <!-- FAQPage Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is LocalHouseLLM?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LocalHouseLLM is a modular AI architecture company building Anvira — local-first AI that runs on your own hardware. Unlike cloud-dependent AI, Anvira keeps your data private while delivering specialized intelligence through expert modules."
          }
        },
        {
          "@type": "Question",
          "name": "What is Anvira?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Anvira is a family of modular AI models: o1 for personal local AI, o1e for enterprise on-premises infrastructure, and h1 for embedded AI in robotics and edge devices. All run without cloud dependency."
          }
        },
        {
          "@type": "Question",
          "name": "How is modular AI different from monolithic LLMs like GPT?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Monolithic LLMs use billions of parameters for every query. Modular AI activates only specialized expert modules needed for each task — resulting in faster responses, lower compute costs, and higher accuracy without parameter bloat."
          }
        },
        {
          "@type": "Question",
          "name": "Can Anvira run offline without internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Anvira o1 and h1 are designed to run entirely on local hardware with zero cloud dependency. Your data never leaves your device, making it ideal for privacy-sensitive and air-gapped environments."
          }
        },
        {
          "@type": "Question",
          "name": "What is InkFlow?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "InkFlow is an AI writing assistant by LocalHouseLLM that provides advanced grammar correction, AI copywriting, and tone optimization to help professionals write compelling, clear content faster."
          }
        },
        {
          "@type": "Question",
          "name": "What is DevQuill?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "DevQuill is an AI coding assistant that helps developers write clean, production-ready code through smart code generation, context-aware refactoring, and intelligent debugging."
          }
        }
      ]
    }
